name: StudyForge
options:
  bundleIdPrefix: com.estudiosoftware
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Supabase — uncomment in Phase 3
# packages:
#   Supabase:
#     url: https://github.com/supabase/supabase-swift
#     from: "2.0.0"

targets:
  StudyForge:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: StudyForge
        excludes:
          - "Widgets/**"
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: StudyForge
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    # dependencies:
    #   - package: Supabase  # Uncomment in Phase 3
    entitlements:
      path: StudyForge/StudyForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  StudyForgeTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyForge/Tests
    dependencies:
      - target: StudyForge_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForgeTests
        GENERATE_INFOPLIST_FILE: YES

  StudyForgeTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StudyForge/Tests
    dependencies:
      - target: StudyForge_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForgeTests
        GENERATE_INFOPLIST_FILE: YES
