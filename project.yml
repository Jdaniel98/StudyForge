name: StudyForge
options:
  bundleIdPrefix: com.estudiosoftware
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  StudyForge:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: StudyForge
        excludes:
          - "Widgets/**"
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: StudyForge
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - package: Supabase
    entitlements:
      path: StudyForge/StudyForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  StudyForgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyForgeWidgets
      - path: StudyForge/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForge.Widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_CFBundleDisplayName: StudyForge Widgets
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - target: StudyForge_iOS
        embed: false

  StudyForgeTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyForge/Tests
    dependencies:
      - target: StudyForge_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForgeTests
        GENERATE_INFOPLIST_FILE: YES

  StudyForgeTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StudyForge/Tests
    dependencies:
      - target: StudyForge_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estudiosoftware.StudyForgeTests
        GENERATE_INFOPLIST_FILE: YES
